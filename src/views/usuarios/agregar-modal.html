<div class="modal fade" id="modal-crear-usuario" aria-hidden="true" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title ps-1">
                    <i class="bi bi-person-plus-fill me-2"></i>Nuevo Usuario
                </h5>

                <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <form class="row g-3" id="form-crear-usuario">
                    <div class="col-md">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Escriba un
                            empleado</label>

                        <input class="form-control filter-input" id="input-usuario" type="text"
                            placeholder="Escriba aqui el nombre..." required>
                        </input>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary-custom" data-bs-dismiss="modal" type="button">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </button>

                <button class="btn btn-primary-custom" id="btn-crear-usuario" type="button">
                    <i class="bi bi-check-circle me-1"></i>Crear Usuario
                </button>
            </div>
        </div>
    </div>
</div>
