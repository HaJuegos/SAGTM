<div class="modal fade" id="modal-crear-cargo" aria-hidden="true" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title ps-1">
                    <i class="bi bi-pencil-fill me-2"></i>Crear nuevo cargo
                </h5>

                <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <form class="row g-3" id="form-crear-cargo">
                    <div class="col-12 pb-2">
                        <h6 class="text-primary fw-bold mb-0">Datos del Cargo</h6>
                    </div>

                    <div class="col-md">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Nombre del Cargo</label>

                        <input class="form-control filter-input" id="input-nueva-cargo" type="text"
                            placeholder="Escriba el nombre del Cargo..." required>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary-custom" data-bs-dismiss="modal" type="button">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </button>

                <button class="btn btn-primary-custom" id="btn-crear-cargo" type="button">
                    <i class="bi bi-check-circle me-1"></i>Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>
