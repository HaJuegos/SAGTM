<div class="modal fade" id="modal-editar-usuario" aria-hidden="true" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered customsize-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title ps-1">
                    <i class="bi bi-person-plus-fill me-2"></i>Editar Empleado
                </h5>

                <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <form class="row g-3" id="form-editar-usuario">
                    <input id="input-empleado-id" type="text" hidden required>

                    <div class="col-12 pb-2">
                        <h6 class="text-primary fw-bold mb-0">Datos Personales</h6>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Primer Nombre</label>

                        <input class="form-control filter-input" id="input-p-nombre-editar" name="primer_nombre"
                            type="text" placeholder="Escriba aqui el nombre..." required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Segundo Nombre</label>

                        <input class="form-control filter-input" id="input-s-nombre-editar" name="primer_nombre"
                            type="text" placeholder="Escriba aqui el nombre...">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Primer Apellido</label>

                        <input class="form-control filter-input" id="input-p-apellido-editar" name="primer_nombre"
                            type="text" placeholder="Escriba aqui el nombre..." required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Segundo Apellido</label>

                        <input class="form-control filter-input" id="input-s-apellido-editar" name="primer_nombre"
                            type="text" placeholder="Escriba aqui el nombre...">
                    </div>

                    <div class="col-12 mt-4">
                        <h6 class="text-primary fw-bold mb-0">Asignación Corporativa</h6>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Cargo</label>

                        <input class="form-control filter-input" id="input-cargo-editar" name="cargo_id"
                            placeholder="Escriba aqui el Cargo..." required>
                        </input>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Área</label>

                        <input class="form-control filter-input" id="input-area-editar" name="area_id"
                            placeholder="Escriba aqui el Area..." required>
                        </input>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary-custom" data-bs-dismiss="modal" type="button">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </button>

                <button class="btn btn-primary-custom" id="btn-editar-usuario" type="button">
                    <i class="bi bi-check-circle me-1"></i>Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>
