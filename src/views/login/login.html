<div class="login-container">
    <div class="card login-card">
        <div class="login-card-body">
            <div class="login-header">
                <i class="bi bi-calendar-check login-icon"></i>
                <h3 class="login-title">Sistema de Turnos</h3>
                <p class="login-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <form id="iniciar-sesion-form" method="post">
                <div class="mb-3">
                    <label class="form-label" for="usuario">
                        <i class="bi bi-person me-1"></i>Usuario
                    </label>
                
                    <div class="input-group-icon">
                        <i class="bi bi-person-fill"></i>
                        <input class="form-control" id="usuario-input" name="usuario" type="text" placeholder="Ingresa tu usuario"
                            required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label" for="contrasena">
                        <i class="bi bi-lock me-1"></i>Contraseña
                    </label>
                
                    <div class="input-group-icon">
                        <i class="bi bi-lock-fill"></i>
                
                        <input class="form-control" id="contrasena-input" name="contrasena" type="password"
                            placeholder="Ingresa tu contraseña" required>
                
                        <i class="bi bi-eye toggle-password" id="btn-toggle-pass"></i>
                    </div>
                </div>
                
                <div class="d-grid">
                    <button class="btn btn-login" id="btn-login" type="submit">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
