<div class="modal fade" id="modal-editar-usuario" aria-hidden="true" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered customsize-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title ps-1">
                    <i class="bi bi-person-plus-fill me-2"></i>Editar Usuario
                </h5>

                <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
                <form class="row g-3" id="form-editar-usuario">
                    <input id="input-usuario-id" type="text" hidden required>

                    <div class="col-12 pb-2">
                        <h6 class="text-primary fw-bold mb-0">Datos Personales</h6>
                    </div>

                    <div class="col-md">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Usuario</label>

                        <input class="form-control filter-input" id="input-nombre-usuario" type="text"
                            placeholder="Escriba aqui el usuario..." required>
                    </div>

                    <div class="col-md">
                        <label class="form-label small text-uppercase fw-bold text-secondary">Contraseña</label>

                        <input class="form-control filter-input" id="input-contrasena" type="password"
                            placeholder="Escriba aqui la contraseña...">
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary-custom" data-bs-dismiss="modal" type="button">
                    <i class="bi bi-x-circle me-1"></i>Cancelar
                </button>

                <button class="btn btn-primary-custom" id="btn-editar-usuario" type="button">
                    <i class="bi bi-check-circle me-1"></i>Guardar Cambios
                </button>
            </div>
        </div>
    </div>
</div>
